<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arrais — Test Page</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #0f1117;
    color: #e8eaf0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .badge {
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 99px;
    background: #1a1d27;
    color: #4f7cff;
    border: 1px solid #2e3352;
    margin-bottom: 24px;
    display: inline-block;
  }
  h1 { font-size: 48px; font-weight: 700; letter-spacing: -1px; margin-bottom: 12px; }
  p { font-size: 16px; color: #7c82a0; max-width: 400px; line-height: 1.6; margin-bottom: 32px; }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: #22c55e;
    background: #052e16;
    border: 1px solid #14532d;
    padding: 10px 20px;
    border-radius: 10px;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #22c55e;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .footer {
    position: fixed;
    bottom: 20px;
    font-size: 12px;
    color: #2e3352;
  }
</style>
</head>
<body>
  <span class="badge">Arrais Project</span>
  <h1>⚓ Arrais</h1>
  <p>This is a test deployment page. The project is live on Vercel and connected to GitHub.</p>
  <div class="status">
    <div class="dot"></div>
    Deployed successfully
  </div>
  <div class="footer">lafraiarafael/arrais · Vercel</div>
</body>
</html>
